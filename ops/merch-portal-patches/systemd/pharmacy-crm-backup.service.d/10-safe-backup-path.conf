[Service]
# Keep scheduled retention separate from historical/manual archives.
# PostgreSQL peer auth permits a complete dump without granting the app role
# access to every table; supplementary group reads application uploads.
User=postgres
Group=postgres
SupplementaryGroups=pharmacy-crm
EnvironmentFile=
ExecStart=
ExecStart=/usr/bin/env BACKUP_DIR=/var/backups/pharmacy-crm-demo/scheduled BACKUP_RETENTION_DAYS=14 DB_HOST=/var/run/postgresql DB_NAME=pharmacy_crm DB_USER=postgres APPLICATION_DIR=/opt/pharmacy-crm-demo /opt/pharmacy-crm-demo/scripts/backup.sh
