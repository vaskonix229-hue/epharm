name: pharmacy
description: Epharm — Flutter app for pharmacists (bonuses, training, AI exam).
publish_to: 'none'
version: 0.1.11+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # SVG (Receipt Stamp logo)
  flutter_svg: ^2.0.16

  # Inputs
  mask_text_input_formatter: ^2.9.0
  pinput: ^5.0.1

  # HTTP-клиент для реального backend (Фаза A+: /api/mobile/**). Выбран http (а не dio):
  # уже в кэше/транзитивен, MockClient из package:http/testing.dart даёт тесты без доп. пакетов.
  http: ^1.2.0

  # Дисковый кэш сетевых фото витрины (через наш прокси /api/media/img). Без него
  # рециклируемые плитки SliverGrid пере-фетчат+пере-декодят фото при возврате во
  # вьюпорт и после рестарта → микро-лаги скролла ленты + лишняя нагрузка на прокси.
  cached_network_image: ^3.4.1
  # Транзитив cached_network_image, но импортируем напрямую (общий CacheManager
  # с лимитами в image_cache_config.dart) → объявляем прямой зависимостью.
  flutter_cache_manager: ^3.4.1

  # Открытие внешних ссылок (YouTube video-инструкция, WhatsApp поддержка).
  url_launcher: ^6.3.1

  # Камера для съёмки чеков. Управляет permissions нативно (iOS Info.plist key
  # + Android <uses-permission/> в манифесте). См. docs/claude-notes.md Этап 3.
  camera: ^0.11.0+2

  # QR-регистрация на очных мероприятиях. Ветка 5.x сохраняет поддержку iOS 12,
  # которая заявлена текущим iOS-проектом; 6.x требует iOS 15.5+.
  mobile_scanner: ^5.2.3

  # Выбор фото из системной галереи как альтернатива камере.
  image_picker: ^1.1.2
  flutter_secure_storage: ^10.3.1
  # sentry_flutter allows a very broad package_info_plus range. Version 9+
  # requires Gradle 8.13/AGP 8.12/Kotlin 2.2, newer than Flutter 3.27's toolchain.
  package_info_plus: 8.3.1
  # 9.7+ pulls sentry-cocoa 8.56+, whose Swift closure APIs fail under Xcode 26
  # (getsentry/sentry-dart#3570). Remove this pin only after an iOS compile gate passes.
  sentry_flutter: 9.6.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

# Иконка приложения — фирменный знак-чек (палитра Claude, ярко-оранжевый коралл).
# Источник рисуется tools/generate_app_icon.py. Перегенерация:
#   python3 tools/generate_app_icon.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#E07E52'
  adaptive_icon_background: assets/icon/app_icon_bg.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Variable.ttf
